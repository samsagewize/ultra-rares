<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#aef600;overflow:hidden}a{display:block;width:100%;height:100%;position:relative;color:#fff;font:900 11px "Courier New",monospace}img{width:100%;height:100%;object-fit:contain;display:block}span{position:absolute;left:8px;top:8px;padding:6px 8px;background:#050709;border:2px solid #aef600;letter-spacing:1px}</style></head><body><a id="art" target="_blank" rel="noopener noreferrer"><img id="image" alt="Today's Super Rare artwork"><span id="label">SUPER RARE #1</span></a><script>const q=new URLSearchParams(location.search),id=q.get('token')||'1',url=q.get('url')||'#',image=q.get('image');document.querySelector('#art').href=url;document.querySelector('#label').textContent=`SUPER RARE #${id}`;const img=document.querySelector('#image');if(image)img.src=image;else{img.remove();document.body.insertAdjacentHTML('beforeend','<div style="display:grid;place-items:center;width:100%;height:100%;font:900 22px Courier New">ARTWORK REVEALING…</div>')}</script></body></html>
