<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The locked Ultra Rares vault. See you at $100K." />
    <title>Vault — Ultra Rares</title>
    <link rel="icon" type="image/png" href="assets/rare-token.png" />
    <script>document.documentElement.classList.replace('no-js', 'js');</script>
    <link rel="stylesheet" href="styles.css?v=60" />
  </head>
  <body class="rare-page vault-page home-loading milestone-locked" data-milestone-gate="100000">
    <div class="home-loader" data-home-loader role="status" aria-live="polite" aria-label="Loading the RARE vault"><div class="home-loader-inner"><div class="home-loader-mark"><img src="assets/rare-token.png" alt="$RARE token" /><span class="home-loader-orbit" aria-hidden="true"></span></div><strong>$RARE</strong><small>Approaching the vault</small><button type="button" data-loader-sound aria-pressed="true">Sound: on</button><span class="home-loader-progress" aria-hidden="true"><i></i></span></div></div>

    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="Ultra Rares home"><img src="assets/banner-2.png" alt="" /></a>
      <nav aria-label="Primary navigation">
        <a class="nav-link" href="index.html#collection">Collection</a>
        <a class="nav-link" href="index.html#proof-of-work">Proof of Work</a>
        <a class="nav-link" href="rare.html">$RARE</a>
        <a class="nav-link" href="marketplace.html">Auctions</a>
        <span class="nav-link nav-disabled" aria-disabled="true">World locked</span>
        <a class="nav-link active" href="vault.html">Vault</a>
        <a class="nav-link" href="launch.html">Launch</a>
        <a class="nav-link" href="https://opensea.io/collection/ultra-rares-robinhood/activity" target="_blank" rel="noopener noreferrer">OpenSea</a>
      </nav>
    </header>

    <main class="vault-main">
      <section class="vault-journey" data-vault-journey aria-labelledby="vault-title">
        <div class="vault-stage">
          <div class="vault-grid" aria-hidden="true"></div>
          <div class="vault-copy">
            <p class="eyebrow">Restricted / Milestone locked</p>
            <h1 id="vault-title">THE<br />VAULT.</h1>
            <p>Scroll to approach.</p>
          </div>

          <div class="vault-perspective" aria-hidden="true">
            <div class="vault-body">
              <span class="vault-bolt bolt-1"></span><span class="vault-bolt bolt-2"></span><span class="vault-bolt bolt-3"></span><span class="vault-bolt bolt-4"></span>
              <div class="vault-door">
                <div class="vault-door-ring">
                  <div class="vault-wheel">
                    <i></i><i></i><i></i><i></i><i></i><i></i>
                    <span class="vault-number number-0">00</span><span class="vault-number number-1">10</span><span class="vault-number number-2">20</span><span class="vault-number number-3">30</span><span class="vault-number number-4">40</span><span class="vault-number number-5">50</span>
                    <b><img src="assets/rare-token.png" alt="" /></b>
                  </div>
                </div>
                <span class="vault-lock-light"></span>
              </div>
              <div class="vault-hinges"><i></i><i></i><i></i></div>
            </div>
          </div>

          <div class="vault-locked-sign" data-milestone-panel role="status" aria-live="polite" aria-label="Vault locked until 100 thousand dollar milestone">
            <span data-milestone-label>Vault locked</span>
            <strong>SEE YOU AT $100K</strong>
            <small data-milestone-status>Checking live $RARE market cap…</small>
            <div class="milestone-gate-track" aria-hidden="true"><i data-milestone-progress></i></div>
            <button type="button" data-milestone-open disabled aria-disabled="true">Open vault</button>
          </div>

          <div class="vault-scroll-meter" aria-hidden="true"><span></span><small>Approach</small></div>
        </div>
      </section>

    </main>

    <script src="loader.js?v=1"></script>
    <script src="vault-experience.js?v=1"></script>
    <script src="milestone-gate.js?v=1"></script>
  </body>
</html>
